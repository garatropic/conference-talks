<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angular flight demo backup</title>
<style>
  body { margin: 32px auto; padding: 0 20px; max-width: 920px; background: #f8fbfd; color: #202124; font: 19px/1.4 Arial, sans-serif; }
  h1 { line-height: 1.05; margin-bottom: 12px; }
  details { margin: 10px 0; padding: 12px; background: white; border: 2px solid #202124; border-radius: 10px; }
  summary { cursor: pointer; font-weight: 700; }
  img { display: block; max-width: 100%; max-height: 72vh; margin: 12px auto 0; }
</style>
<main>
  <h1>Angular flight demo backup</h1>
  <p>Five captures from the Angular app with fictional data.</p>
  <details name="flight-step" open>
    <summary>1. Compare flights</summary>
    <img src="flight-compare.jpg" alt="Three fictional flights from Nairobi to Mombasa">
  </details>
  <details name="flight-step">
    <summary>2. Pick a seat</summary>
    <img src="flight-seat.jpg" alt="Seat map with seat 12A selected">
  </details>
  <details name="flight-step">
    <summary>3. Enter passenger details</summary>
    <img src="flight-passenger.jpg" alt="Passenger details form filled with fictional values">
  </details>
  <details name="flight-step">
    <summary>4. Review the total</summary>
    <img src="flight-payment.jpg" alt="Simulated checkout showing the itinerary and total">
  </details>
  <details name="flight-step">
    <summary>5. Find the booking reference</summary>
    <img src="flight-confirmation.jpg" alt="Simulated confirmation showing flight, seat and reference">
  </details>
</main>

name: Publish slides

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/slides-pages.yml
      - package.json
      - package-lock.json
      - patches/**
      - site/**
      - slides/**
      - output/pdf/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: pages
        uses: actions/configure-pages@v5
      - name: Install gallery dependencies
        run: npm ci
      - name: Build the public slide library
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node site/build.mjs "${{ runner.temp }}/slides-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/slides-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
